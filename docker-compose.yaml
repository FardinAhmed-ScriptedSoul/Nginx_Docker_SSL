services:
  app1:
    build: .
    container_name: app1
    environment:
      APP_NAME: app1
    ports:
      - "30001:3000"

  app2:
    build: .
    container_name: app2
    environment:
      APP_NAME: app2
    ports:
      - "30002:3000"

  app3:
    build: .
    container_name: app3
    environment:
      APP_NAME: app3
    ports:
      - "30003:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-certs:/etc/nginx/ssl:ro
    depends_on:
      - app1
      - app2
      - app3